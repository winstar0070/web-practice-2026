
<!DOCTYPE html>
<html lang="ko" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼태그 실습</title>
    <meta
      name="description"
      content="이미지 태그와 폼태그를 사용한 실습 페이지"
    >
    <meta
      property="og:url"
      content="https://winstar0070.github.io/web-practice-2026/week3/index.html"
    >
    <meta property="og:title" content="폼태그 실습">
    <meta
      property="og:description"
      content="이미지 태그와 폼태그를 사용한 실습 페이지"
    >
  </head>
  <body>
    <a href="#main-content">본문 바로가기</a>

    <header>
      <h1>홍윤석</h1>
    </header>

    <main id="main-content">
      <section>
        <h2>이미지 태그</h2>
        <img
          src="https://avatars.githubusercontent.com/u/36693200?v=4"
          alt="깃허브 프로필 사진"
          width="460"
          height="460"
        >
      </section>

      <section>
        <h2>폼태그</h2>
        <form>
          <fieldset>
            <legend>문의하기</legend>

            <label for="name">이름</label>
            <input
              type="text"
              id="name"
              name="name"
              autocomplete="name"
            >
            <br>
            <br>

            <label for="email">이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              spellcheck="false"
            >
            <br>
            <br>

            <label for="inquiry-type">문의 유형</label>
            <select id="inquiry-type" name="inquiry-type">
              <option value="study">학습 문의</option>
              <option value="project">프로젝트 문의</option>
              <option value="other">기타 문의</option>
            </select>
            <br>
            <br>

            <label for="message">문의 내용</label>
            <textarea id="message" name="message"></textarea>

            <button type="submit">제출</button>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
      <p>
        Copyright &copy; 2026 홍윤석
        (<a href="mailto:webmaster@stu.jejunu.ac.kr">webmaster@stu.jejunu.ac.kr</a>)
      </p>
    </footer>
  </body>
</html>
