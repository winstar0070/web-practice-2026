<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0"/>
        <title>Document</title>
        <meta property="og:url" content="https://winstar0070.github.io/web-practice-2026/week3/practice.html"/>
        <meta property="og:title" content="폼태그 실습"/>
        <meta property="og:description" content="폼태그를 사용한 실습 페이지"/>

    </head>
    <body>
        <h1>이미지 태그</h1>
        <img src="https://avatars.githubusercontent.com/u/36693200?v=4" alt="깃허브 프로필 사진"/>

        <h1>폼태그</h1>
        <form>
            <fieldset>
                <legend>문의하기</legend>
                <label for="name">이름</label>
                <input type="text" id="name" name="name" />
                <br/>
                <br/>

                <label for="email">이메일</label>
                <input type="email" id="email" name="email" />
                <br/>
                <br/>
                <label for="message">문의 내용</label>
                <textarea id="message" name="message"></textarea>

                <button type="submit">제출</button>
            </fieldset>
        </form>
    </body>
    <footer>
        <p>Copyright &copy; 2026 홍윤석(webmaster@stu.jejunu.ac.kr)</p>
    </footer>
</html>
