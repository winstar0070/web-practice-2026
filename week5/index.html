<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 쇼핑몰</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <strong>쇼핑몰</strong>
        <nav>
            <a href="#products">전체 상품</a>
            <a href="#new">신상품</a>
            <a href="#sale">세일</a>
        </nav>
        <span>장바구니 (0)</span>
    </header>

    <main>
        <div class="banner">
            <h1>쇼핑몰에 오신 것을 환영합니다</h1>
            <p>여러 가지 상품을 구경하세요.</p>
        </div>

        <section id="products">
            <h2>상품 목록</h2>
            <div class="products">
                <div class="product" id="sale">
                    <span class="badge">SALE</span>
                    <h3>머그컵</h3>
                    <p>12,000원</p>
                </div>
                <div class="product" id="new">
                    <span class="badge">NEW</span>
                    <h3>미니 화분</h3>
                    <p>18,000원</p>
                </div>
                <div class="product">
                    <h3>테이블 조명</h3>
                    <p>32,000원</p>
                </div>
                <div class="product">
                    <h3>탁상시계</h3>
                    <p>24,000원</p>
                </div>
                <div class="product">
                    <h3>데일리 노트</h3>
                    <p>9,000원</p>
                </div>
                <div class="product">
                    <h3>수납 바구니</h3>
                    <p>21,000원</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
